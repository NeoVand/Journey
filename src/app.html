<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#c6e5fd" />
		<!-- The transition also tells Safari not to sample one colour at load and keep it for the status bar, so it follows the page instead. -->
		<style>html { background: #c6e5fd; } html, body, canvas { transition: background-color 0.25s; }</style>
		%sveltekit.head%
		<noscript><style>.loader { display: none; }</style></noscript>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
