<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#c6e5fd" />
		<title>Nothing at this address · The journey of a token</title>
		<!-- GitHub Pages serves this for any address it can't find, at any depth, so everything here is absolute. -->
		<style>
			@font-face {
				font-family: 'Bricolage Grotesque';
				src: url('/Journey/fonts/bricolage.woff2') format('woff2');
				font-weight: 200 800;
				font-display: swap;
			}
			@font-face {
				font-family: 'Instrument Sans';
				src: url('/Journey/fonts/instrument-sans.woff2') format('woff2');
				font-weight: 400 700;
				font-display: swap;
			}
			html {
				min-height: 100%;
				background: linear-gradient(#a9d6fb, #c6e5fd 55%, #e3f1fd);
				color: #101a30;
				font-family: 'Instrument Sans', system-ui, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			body {
				display: grid;
				place-items: center;
				min-height: 100svh;
				margin: 0;
				padding: 24px;
				box-sizing: border-box;
			}
			main {
				width: min(520px, 100%);
			}
			/* The token, as in the favicon and on the map, landing where the page should have been. */
			.token {
				display: block;
				width: 72px;
				height: 72px;
				margin-bottom: 26px;
				animation: land 0.7s 0.15s cubic-bezier(0.2, 1.5, 0.4, 1) backwards;
			}
			@keyframes land {
				from {
					opacity: 0;
					transform: translateY(-40px) scale(0.75, 1.15);
				}
				40% {
					opacity: 1;
				}
			}
			h1 {
				margin: 0 0 14px;
				font-family: 'Bricolage Grotesque', system-ui, sans-serif;
				font-weight: 800;
				font-size: clamp(36px, 8vw, 54px);
				line-height: 1;
				letter-spacing: -0.03em;
				text-wrap: balance;
			}
			p {
				margin: 0 0 28px;
				font-size: 18px;
				line-height: 1.5;
				color: #33415c;
				text-wrap: pretty;
			}
			a {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				padding: 14px 18px 15px 24px;
				border-radius: 16px;
				background: linear-gradient(#ffd660, #ffb921 70%);
				color: #101a30;
				font-family: 'Bricolage Grotesque', system-ui, sans-serif;
				font-weight: 800;
				font-size: 21px;
				line-height: 1;
				text-decoration: none;
				box-shadow:
					inset 0 2px 0 rgb(255 255 255 / 0.6),
					0 6px 0 #d18b00,
					0 12px 24px rgb(150 90 0 / 0.3);
				transition:
					transform 0.08s,
					box-shadow 0.08s;
			}
			a:active {
				transform: translateY(5px);
				box-shadow:
					inset 0 2px 0 rgb(255 255 255 / 0.6),
					0 1px 0 #d18b00,
					0 4px 9px rgb(150 90 0 / 0.3);
			}
			a:focus-visible {
				outline: 3px solid #1f5fe0;
				outline-offset: 4px;
			}
			a svg {
				width: 20px;
				height: 20px;
			}
			@media (hover: hover) {
				a:hover {
					transform: translateY(-1px);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.token {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<svg class="token" viewBox="0 0 64 64" aria-hidden="true">
				<rect x="5" y="16" width="54" height="40" rx="10" fill="#c9820a" />
				<rect x="5" y="9" width="54" height="40" rx="10" fill="#ffbc12" />
				<rect x="9" y="12.5" width="46" height="4" rx="2" fill="#ffe08a" />
				<path d="M21 22h22v6h-8v15h-6V28h-8z" fill="#16243d" />
			</svg>
			<h1>There’s nothing at this address</h1>
			<p>The link may be mistyped, or the page has moved. The whole journey is on one page, and it starts here.</p>
			<a href="/Journey/">
				Go to the journey
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M9 6l6 6-6 6" />
				</svg>
			</a>
		</main>
	</body>
</html>
